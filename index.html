<style id="muse-v8">
/* ============================================================
   LingoREA v8 · Sistema profesional + escenografía viva
   Tokens propios, tipografía con jerarquía, componentes con un
   solo lenguaje de sombra/luz, el camino como viaje, y las
   escenas ANIMADAS (el CSS original las anulaba con un
   `.scene *{animation:none!important}` que aquí se corrige).
   ============================================================ */

/* ---------- TOKENS: la paleta y la medida de todo ---------- */
:root{
  --bg:#F6F3EB; --surface:#FFFFFF; --surface2:#EEEADD; --line:#DFD8C3;
  --text:#17251D; --muted:#5A665C;
  --primary:#157347; --primary-2:#0C4F30; --leaf:#8CC63F; --beak:#F98232; --beak2:#FFD84A;
  --tip:#1F6E8C; --success:#177245; --error:#BE3A34;
  --font-display:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --shadow-1:0 1px 2px rgba(23,37,29,.05),0 8px 24px -12px rgba(23,37,29,.18);
  --shadow-2:0 2px 4px rgba(23,37,29,.06),0 20px 40px -16px rgba(23,37,29,.28);
  --v8-ease:cubic-bezier(.22,1,.36,1); --v8-spring:cubic-bezier(.34,1.45,.64,1);
}
[data-theme="dark"]{
  --bg:#0B120E; --surface:#15211A; --surface2:#1D2C23; --line:#2B3F33;
  --text:#F1EFE3; --muted:#A4B3A7; --primary:#7BD66B; --primary-2:#4E9E42;
  --success:#4CD38A; --error:#FF7A72;
  --shadow-1:0 1px 2px rgba(0,0,0,.45),0 10px 26px -12px rgba(0,0,0,.55);
  --shadow-2:0 2px 4px rgba(0,0,0,.5),0 24px 44px -16px rgba(0,0,0,.65);
}

/* ---------- TIPOGRAFÍA: jerarquía de producto ---------- */
body{ font-size:16.5px; }
body .display{ font-family:var(--font-display); font-weight:800; letter-spacing:-.022em; }
body .brand{ font-family:var(--font-display); letter-spacing:-.02em; }
body .num, body .stat b, body .lvl-pct{ font-variant-numeric:tabular-nums; }
body .label, body .kicker{ letter-spacing:.09em; }

/* ---------- ATMÓSFERA (discreta, profesional) ---------- */
body::before{ content:""; position:fixed; inset:-14% -10%; z-index:0; pointer-events:none; opacity:.55;
  background:
    radial-gradient(560px 380px at 10% 4%, color-mix(in srgb, var(--leaf) 13%, transparent), transparent 65%),
    radial-gradient(640px 430px at 90% 12%, color-mix(in srgb, var(--beak2) 9%, transparent), transparent 65%),
    radial-gradient(760px 540px at 50% 110%, color-mix(in srgb, var(--tip) 8%, transparent), transparent 65%);
  animation:v8aurora 30s ease-in-out infinite alternate; }
.app{ position:relative; z-index:1; }

/* ---------- CRISTAL: cabecera y navegación ---------- */
body .top{ background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3); }
body .nav{ background:color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter:blur(16px) saturate(1.35); -webkit-backdrop-filter:blur(16px) saturate(1.35); box-shadow:0 -10px 30px -16px rgba(10,20,14,.35); }
body .nav button[aria-current="page"]{ color:var(--primary); }
body .nav button[aria-current="page"] .ni{ filter:drop-shadow(0 0 7px color-mix(in srgb, var(--primary) 60%, transparent)); }
[data-theme="dark"] body .nav{ background:color-mix(in srgb, var(--surface) 66%, transparent); }
body .stat{ background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-1); border-radius:var(--r-pill); }
body .seg{ box-shadow:inset 0 1px 3px rgba(23,37,29,.08); }

/* ============================================================
   ESCENOGRAFÍA VIVA — el arte respira
   ============================================================ */
/* Resurrección: anula el apagón general de escenas del CSS viejo */
body .scene .cl{ animation:v8drift 26s ease-in-out infinite alternate !important; }
body .scene .plane{ animation:v8fly 11s ease-in-out infinite alternate !important; }
body .scene .steam{ animation:v8steam 3.2s ease-in-out infinite !important; }
body .scene .wave{ animation:v8wave 5.5s ease-in-out infinite alternate !important; }
@keyframes v8drift{ from{ transform:translateX(-14px);} to{ transform:translateX(18px);} }
@keyframes v8fly{ from{ transform:translate(0,0) rotate(-1deg);} to{ transform:translate(26px,-12px) rotate(1.5deg);} }
@keyframes v8steam{ 0%{ transform:translateY(0) scaleX(1); opacity:0;} 25%{ opacity:.75;} 100%{ transform:translateY(-12px) scaleX(1.5); opacity:0;} }
@keyframes v8wave{ from{ transform:translateX(-6px);} to{ transform:translateX(8px);} }
/* Parallax vivo: cada capa de la escena se mueve a su ritmo */
body .scene .l0{ animation:v8par0 34s ease-in-out infinite alternate !important; }
body .scene .l1{ animation:v8par1 26s ease-in-out infinite alternate !important; }
body .scene .l2{ animation:v8par2 20s ease-in-out infinite alternate !important; }
body .scene .l3{ animation:v8par3 15s ease-in-out infinite alternate !important; }
@keyframes v8par0{ from{ transform:translateX(-3px);} to{ transform:translateX(4px);} }
@keyframes v8par1{ from{ transform:translateX(-6px);} to{ transform:translateX(7px);} }
@keyframes v8par2{ from{ transform:translateX(-9px);} to{ transform:translateX(10px);} }
@keyframes v8par3{ from{ transform:translateX(-13px);} to{ transform:translateX(14px);} }
/* La escena completa respira (Ken Burns muy lento, solo en el héroe) */
body .hero-scene .scene{ animation:v8kenburns 36s ease-in-out infinite alternate; }
@keyframes v8kenburns{ from{ transform:scale(1.02) translateY(0);} to{ transform:scale(1.09) translateY(-6px);} }
/* Grado cinematográfico: luz cálida arriba, viñeta suave, luz que cruza */
body .hero-scene::after, body .unit-banner::after{ content:""; position:absolute; inset:0; z-index:3; pointer-events:none;
  background:
    linear-gradient(180deg, rgba(255,244,214,.14), transparent 34%),
    radial-gradient(120% 90% at 50% 40%, transparent 62%, rgba(10,18,12,.16)),
    linear-gradient(115deg, transparent 40%, rgba(255,255,255,.10) 50%, transparent 60%);
  background-size:100% 100%, 100% 100%, 260% 100%;
  animation:v8sheen 9s ease-in-out infinite; }
@keyframes v8sheen{ 0%{ background-position:0 0, 0 0, 130% 0;} 55%,100%{ background-position:0 0, 0 0, -50% 0;} }
body .hero-scene{ box-shadow:var(--shadow-2), inset 0 0 0 1px rgba(255,255,255,.14); }
body .unit-banner{ box-shadow:var(--shadow-1), inset 0 0 0 1px rgba(255,255,255,.12); }
body .rays{ animation:v8rays 46s linear infinite; transform-origin:center; }
@keyframes v8rays{ to{ transform:rotate(360deg);} }

/* ============================================================
   EL CAMINO — por fin un sendero
   ============================================================ */
body .path{ gap:18px; padding-top:26px; }
body .path::before{ content:""; position:absolute; top:6px; bottom:6px; left:50%; width:138px; transform:translateX(-50%);
  border-radius:999px; pointer-events:none;
  background:linear-gradient(180deg, color-mix(in srgb, var(--lang) 12%, var(--surface2)), var(--surface2) 30%, color-mix(in srgb, var(--lang) 9%, var(--surface2))); }
body .path::after{ content:""; position:absolute; top:6px; bottom:6px; left:50%; width:5px; transform:translateX(-50%);
  border-radius:99px; pointer-events:none; opacity:.5;
  background:repeating-linear-gradient(180deg, color-mix(in srgb, var(--lang) 45%, transparent) 0 10px, transparent 10px 22px); }
body .node-wrap{ z-index:1; }
/* Nodos con volumen real: luz radial, anillo interior, sombra en capas */
body .node{ background:radial-gradient(120% 120% at 30% 22%, color-mix(in srgb, var(--lang) 72%, #FFFFFF), var(--lang) 62%);
  box-shadow:0 10px 20px -6px color-mix(in srgb, var(--lang) 55%, transparent), 0 3px 0 color-mix(in srgb, var(--lang) 62%, #000000), inset 0 2px 3px rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.14);
  transition:transform .18s var(--v8-spring), box-shadow .18s var(--v8-ease); }
body .node:active{ transform:translateY(3px) scale(.97); box-shadow:0 4px 10px -4px color-mix(in srgb, var(--lang) 50%, transparent), 0 1px 0 color-mix(in srgb, var(--lang) 62%, #000000), inset 0 2px 3px rgba(255,255,255,.4); }
body .node.todo{ background:radial-gradient(120% 120% at 30% 22%, var(--surface), var(--surface2) 70%); color:var(--muted);
  box-shadow:0 8px 16px -8px rgba(23,37,29,.35), 0 3px 0 var(--line), inset 0 0 0 2px color-mix(in srgb, var(--line) 65%, transparent), inset 0 2px 3px rgba(255,255,255,.5); }
body .node.current{ box-shadow:0 12px 24px -6px color-mix(in srgb, var(--lang) 65%, transparent), 0 3px 0 color-mix(in srgb, var(--lang) 62%, #000000), inset 0 2px 3px rgba(255,255,255,.5), 0 0 0 6px color-mix(in srgb, var(--lang) 22%, transparent); }
body .node-cap{ font-weight:600; }
body .node-wrap:has(.node.current) .node-cap{ background:var(--lang); color:#FFFFFF; padding:3px 12px; border-radius:var(--r-pill); font-weight:800; box-shadow:0 6px 14px -6px color-mix(in srgb, var(--lang) 60%, transparent); }
[data-theme="dark"] body .node-wrap:has(.node.current) .node-cap{ color:#10160F; }
/* Pista de niveles: riel continuo con puntos que sí se leen */
body .lvl-track{ position:relative; }
body .lvl-dot i{ transition:transform .25s var(--v8-spring); }
body .lvl-dot:active i{ transform:scale(1.25); }

/* ---------- SUPERFICIES Y COMPONENTES: un solo lenguaje ---------- */
body .card, body .tile, body .lab-card, body .donate-card, body .goal-pill{
  background:linear-gradient(168deg, var(--surface), color-mix(in srgb, var(--surface2) 48%, var(--surface)));
  border:1px solid color-mix(in srgb, var(--line) 80%, transparent);
  box-shadow:var(--shadow-1), inset 0 1px 0 color-mix(in srgb, #FFFFFF 55%, transparent); }
[data-theme="dark"] body .card, [data-theme="dark"] body .tile, [data-theme="dark"] body .lab-card,
[data-theme="dark"] body .donate-card, [data-theme="dark"] body .goal-pill{
  box-shadow:var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.06); }
[data-theme="dark"] body .goal-pill{ background:linear-gradient(168deg, color-mix(in srgb, var(--surface) 85%, transparent), color-mix(in srgb, var(--surface2) 72%, transparent)); }
body .tile{ transition:transform .26s var(--v8-spring), box-shadow .26s var(--v8-ease); }
@media (hover:hover){ body .tile:hover{ transform:translateY(-2px); box-shadow:var(--shadow-2), inset 0 1px 0 color-mix(in srgb, #FFFFFF 55%, transparent); } }
body .tile:active{ transform:scale(.982); }

/* Botones: adiós sombra de caricatura; hola botón de producto */
body .btn{ background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 82%, #FFFFFF), var(--primary) 58%, color-mix(in srgb, var(--primary) 90%, #000000));
  box-shadow:0 1px 2px rgba(10,25,16,.25), 0 12px 24px -8px color-mix(in srgb, var(--primary) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.35);
  border-radius:var(--r-md); position:relative; overflow:hidden; }
body .btn.ok{ background:linear-gradient(180deg, color-mix(in srgb, var(--success) 82%, #FFFFFF), var(--success) 58%, color-mix(in srgb, var(--success) 90%, #000000));
  box-shadow:0 1px 2px rgba(10,25,16,.25), 0 12px 24px -8px color-mix(in srgb, var(--success) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
body .btn.bad{ background:linear-gradient(180deg, color-mix(in srgb, var(--error) 82%, #FFFFFF), var(--error) 58%, color-mix(in srgb, var(--error) 90%, #000000));
  box-shadow:0 1px 2px rgba(10,25,16,.25), 0 12px 24px -8px color-mix(in srgb, var(--error) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.35); }
body .btn.ghost{ background:var(--surface); box-shadow:var(--shadow-1), inset 0 0 0 1.5px var(--line); }
body .btn:not(.ghost):not(:disabled)::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,.35) 50%, transparent 68%); transform:translateX(-130%); }
body .btn:not(.ghost):not(:disabled):hover::after, body .btn:not(.ghost):not(:disabled):focus-visible::after{ transform:translateX(130%); transition:transform .8s var(--v8-ease); }
body .btn:active{ transform:scale(.97); }
body .btn:active:not(:disabled){ transform:translateY(1px) scale(.97); box-shadow:0 1px 2px rgba(10,25,16,.22), 0 5px 12px -6px color-mix(in srgb, var(--primary) 50%, transparent), inset 0 1px 0 rgba(255,255,255,.3); }

/* Opciones, fichas y barra de progreso */
body .opt{ border-width:1.5px; box-shadow:0 1px 2px rgba(23,37,29,.06), 0 6px 14px -8px rgba(23,37,29,.25); transition:transform .18s var(--v8-spring), border-color .2s var(--v8-ease), box-shadow .2s var(--v8-ease), background .2s var(--v8-ease); }
@media (hover:hover){ body .opt:hover{ border-color:color-mix(in srgb, var(--lang) 55%, var(--line)); box-shadow:0 2px 4px rgba(23,37,29,.06), 0 12px 20px -10px color-mix(in srgb, var(--lang) 45%, transparent); } }
body .opt:active{ transform:scale(.98); }
body .chip{ box-shadow:var(--shadow-1); transition:transform .18s var(--v8-spring), box-shadow .2s var(--v8-ease); }
body .chip:active{ transform:scale(.93); }
[data-theme="dark"] body .opt{ box-shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 18px -10px rgba(0,0,0,.6); }
[data-theme="dark"] body .stat{ box-shadow:var(--shadow-1); }
body .bar{ height:10px; box-shadow:inset 0 1px 3px rgba(23,37,29,.15); }
body .bar > i, body .bar > div{ background:linear-gradient(90deg, var(--leaf), var(--primary)); border-radius:99px; }

/* Hoja de respuestas y cierre */
body .sheet{ border-radius:24px 24px 0 0; }
body .sheet.ok{ box-shadow:0 -12px 34px rgba(10,25,16,.18), inset 0 3px 0 var(--success); }

body .masc.m-hero{ filter:drop-shadow(0 14px 16px rgba(0,0,0,.26)) drop-shadow(0 0 30px color-mix(in srgb, var(--leaf) 42%, transparent)); animation:v8float 5.5s ease-in-out infinite alternate; }

@keyframes v8float{ from{ transform:translateY(0);} to{ transform:translateY(-7px);} }

/* Entrada de cada vista: cascada corta y con resorte */
.view > *{ animation:v8rise .45s var(--v8-ease) backwards; }
.view > *:nth-child(2){ animation-delay:.04s; } .view > *:nth-child(3){ animation-delay:.08s; }
.view > *:nth-child(4){ animation-delay:.12s; } .view > *:nth-child(5){ animation-delay:.16s; }
.view > *:nth-child(6){ animation-delay:.2s; } .view > *:nth-child(7){ animation-delay:.24s; }
.view > *:nth-child(n+8){ animation-delay:.28s; }
@keyframes v8rise{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }

/* Aviso amable de respaldo (lo crea el script de la capa, solo si hay avance sin respaldar) */
.lr-nudge{ position:fixed; left:12px; right:12px; bottom:calc(92px + env(safe-area-inset-bottom)); z-index:55;
  display:flex; gap:10px; align-items:center; padding:12px 14px; border-radius:16px;
  background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line); box-shadow:var(--shadow-2); font-size:14.5px; line-height:1.4; animation:v8rise .45s var(--v8-ease) backwards; }
.lr-nudge button{ flex:none; min-height:40px; padding:0 14px; border-radius:10px; border:0; background:var(--primary); color:var(--onprimary); font-weight:800; }

/* Respeto a quien pide menos movimiento: todo se apaga, escenas incluidas */

  body::before, body .hero-scene::after, body .unit-banner::after, body .masc.m-hero, body .masc.end-masc, .lr-nudge{ animation:none !important; }
  body .scene .cl, body .scene .plane, body .scene .steam, body .scene .wave,
  body .scene .l0, body .scene .l1, body .scene .l2, body .scene .l3, body .hero-scene .scene, body .rays{ animation:none !important; }
  .view > *{ animation:none; }
  body .btn:not(.ghost):not(:disabled)::after{ display:none; } }

"hint":"(see)"},{"text":"pronto.","hint":"soon"}],"spokenText":"","audioAfterAnswer":"Goodbye, see you soon.","acceptedAnswers":["Goodbye, see you soon.","Bye, see you soon."],"canonicalAnswer":"Goodbye, see you soon.","explanation":"«Soon» = pronto. «Bye» es la forma corta de «goodbye».","wordBank":["Goodbye","see","you","soon","late","sun"]},{"id":"en_u1_l5_c7","type":"multiple_choice","heading":"Alguien te dice «Thank you!». ¿Qué respondes?","ipa":"/tʃuz ðə bɛst ˈænsər/","promptTokens":[{"text":"Choose","hint":"elige"},{"text":"the","hint":"la"},{"text":"best","hint":"mejor"},{"text":"answer.","hint":"respuesta"}],"spokenText":"Choose the best answer.","options":[{"id":"o1","text":"You're welcome.","correct":true},{"id":"o2","text":"Of course not.","correct":false},{"id":"o3","text":"I'm welcome.","correct":false}],"canonicalAnswer":"You're welcome.","explanation":"La respuesta natural a «Thank you» es «You're welcome» o «No problem»."}]}],"story":{"title":"A New Classmate","lines":[{"speaker":"Teacher","text":"Good morning, everyone. This is Mariana.","es":"Buenos días a todos. Ella es Mariana."},{"speaker":"Mariana","text":"Hi! Nice to meet you.","es":"¡Hola! Mucho gusto."},{"speaker":"Jorge","text":"Nice to meet you too. I'm Jorge.","es":"Mucho gusto también. Soy Jorge."},{"speaker":"Jorge","text":"Where are you from, Mariana?","es":"¿De dónde eres, Mariana?"},{"speaker":"Mariana","text":"I'm from Mérida, but I live here now.","es":"Soy de Mérida, pero ahora vivo aquí."},{"speaker":"Jorge","text":"Cool! How old are you?","es":"¡Qué padre! ¿Cuántos años tienes?"},{"speaker":"Mariana","text":"I'm sixteen. And you?","es":"Tengo dieciséis. ¿Y tú?"},{"speaker":"Jorge","text":"I'm sixteen too. Welcome to the class!","es":"También tengo dieciséis. ¡Bienvenida a la clase!"}],"question":"¿De dónde es Mariana?","options":[{"id":"en_u1_st_q1_o1","text":"De Mérida","correct":true},{"id":"en_u1_st_q1_o2","text":"De Monterrey","correct":false},{"id":"en_u1_st_q1_o3","text": ","hint":"su (de ella)"},{"text":"grandmother","hint":"abuela"},{"text":"is","hint":"es"},{"text":"very","hint":"muy"},{"text":"funny.","hint":"divertida"}],"spokenText":"Her grandmother is very funny.","acceptedAnswers":["Su abuela es muy divertida.","La abuela de ella es muy divertida."],"canonicalAnswer":"Su abuela es muy divertida.","explanation":"«Funny» es «divertido, chistoso». «Her» indica que la abuela es de ella.","wordBank":["Su","abuela","es","muy","divertida","abuelo","triste"]},{"id":"en_u2_l1_c5","type":"listening","heading":"Escucha y escribe lo que oyes","ipa":"/du ju hæv ˈɛni ˈsɪblɪŋz/","promptTokens":[{"text":"🔊","hint":"Escucha el audio","pos":"Dictado","note":"Usa 🐢 para oírlo más lento"},{"text":"(Pista)","hint":"¿Tienes hermanos?","pos":"Traducción","note":"5 palabras en inglés"}],"spokenText":"Do you have any siblings?","acceptedAnswers":["Do you have any siblings?"],"canonicalAnswer":"Do you have any siblings?","explanation":"«Siblings» incluye hermanos y hermanas. «Any» se usa en preguntas.","wordBank":["Do","you","have","any","siblings","sibling"]},{"id":"en_u2_l1_c6","type":"word_bank","heading":"Escribe esto en inglés","ipa":"","promptTokens":[{"text":"Mi","hint":"my"},{"text":"tía","hint":"aunt"},{"text":"tiene","hint":"has"},{"text":"tres","hint":"three"},{"text":"hijos.","hint":"kids/children"}],"spokenText":"","audioAfterAnswer":"My aunt has three children.","acceptedAnswers":["My aunt has three children.","My aunt has three kids."],"canonicalAnswer":"My aunt has three children.","explanation":"«Children» (hijos, sin importar el género) es el plural irregular de «child». «Kids» es más informal.","wordBank":["My","aunt","has","three","children","have","sons"]},{"id":"en_u2_l1_c7","type":"pair_match","heading":"Une cada palabra con su significado","ipa":"/ɔnt ˈʌŋkəl ˈkʌzən ˈrɛlətɪvz/","promptTokens":[],"spokenText":"aunt, uncle, cousin, relatives","pairs":[{"pairId":"en_u2_l1_c7_p1","left":"aunt","right":"tía"},{"pairId":"en_u2_l1_c7_p rday, Ana went to the market early in the morning."},{"es":"Primero compró fruta y pan. Luego se encontró con una vieja amiga y tomaron café.","speaker":"Narrator","text":"First, she bought fruit and bread. Then, she met an old friend and they drank coffee."},{"es":"¡Ay no! ¿Dónde están mis llaves?","speaker":"Ana","text":"Oh no! Where are my keys?"},{"es":"Las llaves no estaban en su bolsa. Ana estaba preocupada.","speaker":"Narrator","text":"The keys were not in her bag. Ana was worried."},{"es":"¡Mira! Están debajo del pan.","speaker":"Friend","text":"Look! They are under the bread."},{"es":"¡Ja! Estaba muy nerviosa. ¡Gracias!","speaker":"Ana","text":"Ha! I was so nervous. Thank you!"}],"options":[{"correct":true,"id":"en_u12_st_q1_o1","text":"Debajo del pan"},{"correct":false,"id":"en_u12_st_q1_o2","text":"En su casa"},{"correct":false,"id":"en_u12_st_q1_o3","text":"En el café"}],"question":"¿Dónde estaban las llaves de Ana?","questions":[{"options":[{"correct":true,"id":"en_u12_st_q1_o1","text":"Debajo del pan"},{"correct":false,"id":"en_u12_st_q1_o2","text":"En su casa"},{"correct":false,"id":"en_u12_st_q1_o3","text":"En el café"}],"question":"¿Dónde estaban las llaves de Ana?"},{"options":[{"correct":true,"id":"en_u12_st_q2_o1","text":"Compró fruta y pan"},{"correct":false,"id":"en_u12_st_q2_o2","text":"Tomó café"},{"correct":false,"id":"en_u12_st_q2_o3","text":"Perdió las llaves"}],"question":"¿Qué hizo Ana primero en el mercado?"}],"title":"The Lost Keys"},"title":"Contar historias: lo que pasó","unitId":"en_u12","unitNumber":11},{"cefr":"B1","commonMistakes":[{"right":"I need to save money.","why":"«Money» es incontable: no lleva «a» ni plural («moneys» no existe).","wrong":"I need to save a money."},{"right":"How much is it?","why":"Para precios se pregunta «How much is it?», no la traducción literal de «¿cuánto cuesta?».","wrong":"How much costs it?"},{"right":"I paid by card.","why":"El medio de pago va con «by»: by card, by transfer; el efectivo es «in cash».","wrong":"I paid with card."}],"conjugationTable":[{"es":"pago, pagué","pron":"pay → paid","verb":"paid"},{"es":"gasto, gasté","pron":"spend → spent","verb":"spent"},{"es":"ahorro, ahorré","pron":"save → saved","verb":"saved"},{"es":"cuesta, costó","pron":"cost → cost","verb":"cost"},{"es":"pido, pedí (en línea)","pron":"order → ordered","verb":"ordered"},{"es":"compro, compré","pron":"buy → bought","verb":"bought"}],"grammarSummary":"El dinero en inglés se maneja con verbos muy concretos: «pay» (pagar), «spend» (gastar), «save» (ahorrar) y «cost» (costar). «Money» es incontable: no tiene plural y no lleva «a». Para preguntar precios: «How much is it?»; para preguntar si alcanza: «Is it enough?» (¿es suficiente?). Y cuidado con los falsos amigos: «bill» es la cuenta o el recibo por pagar, no un billete de papel moneda (eso es «banknote», o simplemente «cash»).","lessons":[{"challenges":[{"canonicalAnswer":"money↔dinero, cash↔efectivo, card↔tarjeta, bank↔banco","explanation":"Los cuatro básicos del dinero: money (dinero en general), cash (efectivo), card (tarjeta), bank (banco).","heading":"Une cada palabra con su significado","id":"en_u13_l1_c1","ipa":"/ˈmʌni kæʃ kɑrd bæŋk/","pairs":[{"left":"money","pairId":"en_u13_l1_c1_p1","right":"dinero"},{"left":"cash","pairId":"en_u13_l1_c1_p2","right":"efectivo"},{"left":"card","pairId":"en_u13_l1_c1_p3","right":"tarjeta"},{"left":"bank","pairId":"en_u13_l1_c1_p4","right":"banco"}],"promptTokens":[],"spokenText":"money, cash, card, bank","type":"pair_match"},{"canonicalAnswer":"Quisiera abrir una cuenta.","explanation":"«I'd like» es la forma amable de «I want»: ideal en ventanilla.","heading":"¿Qué significa?","id":"en_u13_l1_c2","ipa":"/aɪd laɪk tə ˈoʊpən ən əˈkaʊnt/","options":[{"correct":true,"id":"o1","text":"Quisiera abrir una cuenta."},{"correct":false,"id":"o2","text":"Quisiera cerrar una cuenta."},{"correct":false,"id":"o3","text":"Quisiera abrir una tarjeta."}],"promptTokens":[{"hint":"quisiera","text":"I'd ir síntomas («I have a fever», «a sore throat»), entender las indicaciones de la farmacia («Take one pill twice a day»), pedir una cita («I need an appointment») y reaccionar en una emergencia («We need an ambulance now», «You should rest»).","conjugationTable":[{"pron":"I","verb":"take","es":"yo tomo"},{"pron":"you","verb":"take","es":"tú tomas"},{"pron":"he / she","verb":"takes","es":"él / ella toma"},{"pron":"we","verb":"take","es":"nosotros tomamos"},{"pron":"they","verb":"take","es":"ellos toman"}],"commonMistakes":[{"wrong":"I have pain in my head.","right":"My head hurts. / I have a headache.","why":"El dolor de cabeza tiene palabra propia: «headache». Por eso la cabeza no va con «pain in»: se dice «My head hurts» o «I have a headache». Ojo: con otras partes del cuerpo —la rodilla, por ejemplo— «a pain in my…» sí es natural."},{"wrong":"I am with fever.","right":"I have a fever.","why":"Los síntomas se dicen con «have», no con «am»: I have a fever, I have a cold. «I am» es para estados como «I am sick»."},{"wrong":"Take one pill two times a day.","right":"Take one pill twice a day.","why":"«Dos veces» se dice «twice», no «two times». Es la palabra de todas las indicaciones médicas: once (una vez), twice (dos veces)."}],"lessons":[{"lessonId":"en_u14_l1","title":"El cuerpo y lo que duele","grammarTip":"Para decir que te duele algo: «My + parte del cuerpo + hurts». Si es otra persona: «His leg hurts», «Her back hurts». Y con «I have a pain in my…» señalas el lugar exacto del dolor.","challenges":[{"id":"en_u14_l1_c1","type":"pair_match","heading":"Une cada palabra con su significado","promptTokens":[],"spokenText":"head, arm, leg, back","ipa":"/hɛd ɑrm lɛɡ bæk/","pairs":[{"pairId":"p1","left":"head","right":"cabeza"},{"pairId":"p2","left":"arm","right":"brazo"},{"pairId":"p3","left":"leg","right":"pierna"},{"pairId":"p4","left":"back","right":"espalda"}],"canonicalAnswer":"head↔cabeza, arm↔brazo, leg↔pierna, back↔espalda","explanation":"Cuatro partes básicas del cuerpo: head (cabeza), arm (brazo), leg (pierna) y back (espalda). Ojo: «back» también significa «atrás» en otros contextos."},{"id":"en_u14_l1_c2","type":"multiple_choice","heading":"Elige la opción correcta","promptTokens":[{"text":"My","hint":"mi"},{"text":"___","hint":""},{"text":"hurts.","hint":"duele"}],"spokenText":"My head hurts.","ipa":"/maɪ hɛd hɜrts/","options":[{"id":"o1","text":"head","correct":true},{"id":"o2","text":"heads","correct":false},{"id":"o3","text":"ache","correct":false}],"canonicalAnswer":"head","explanation":"Después de «my» va UNA parte del cuerpo en singular: «My head hurts» (me duele la cabeza). «Ache» es el dolor como sustantivo, no encaja aquí."},{"id":"en_u14_l1_c3","type":"cloze","heading":"Completa la oración","promptTokens":[{"text":"Her","hint":"su (de ella)"},{"text":"leg","hint":"pierna"},{"text":"___","hint":""},{"text":"after","hint":"después"},{"text":"the","hint":"el"},{"text":"game.","hint":"partido"}],"spokenText":"Her leg hurts after the game.","ipa":"/hɜr lɛɡ hɜrts ˈæftər ðə ɡeɪm/","sentenceBefore":"Her leg","sentenceAfter":"after the game.","options":[{"id":"o1","text":"hurts","correct":true},{"id":"o2","text":"hurt","correct":false},{"id":"o3","text":"hurting","correct":false}],"canonicalAnswer":"Her leg hurts after the game.","explanation":"Con «her leg» (ella/eso, tercera persona) el verbo lleva -s: «hurts». Es el mismo patrón de «he works», «she pays»."},{"id":"en_u14_l1_c4","type":"word_bank","heading":"Arma la oración en inglés","promptTokens":[{"text":"Me","hint":"my"},{"text":"duele","hint":"hurts"},{"text":"la","hint":""},{"text":"espalda.","hint":"back"}],"spokenText":"My back hurts.","ipa":"/maɪ bæk hɜrts/","canonicalAnswer":"My back hurts.","acceptedAnswers":["My back hurts.","My back hurts"],"wordBank":["My","back","hurts","her","leg","is"],"explanation":"«Me duele la espalda» se arma como «My back hurts»: primero la parte del cuerpo con su posesivo, luego «hurts»."},{"id":"en_u14_l1_c5","type":"listeni ry interesting.","acceptedAnswers":["That is very interesting.","That is very interesting"],"wordBank":["That","is","very","interesting","funny","great"],"explanation":"«That is very interesting» = eso es muy interesante. La reacción que anima a cualquiera a seguir contando."},{"id":"en_u16_l5_c6","type":"word_bank","heading":"Traduce al español","promptTokens":[{"text":"What","hint":"¿y"},{"text":"about","hint":""},{"text":"your","hint":"tu"},{"text":"family?","hint":"familia"}],"spokenText":"What about your family?","ipa":"/wʌt əˈbaʊt jʊr ˈfæməli/","canonicalAnswer":"¿Y tu familia?","acceptedAnswers":["¿Y tu familia?","Y tu familia?"],"wordBank":["Y","tu","familia","su","hermana"],"explanation":"«What about your family?» se resume en español como «¿Y tu familia?»: el «what about» entero vive en ese «¿y…?»."},{"id":"en_u16_l5_c7","type":"multiple_choice","heading":"Elige la opción correcta","promptTokens":[{"text":"___","hint":""},{"text":"?","hint":""},{"text":"I","hint":"yo"},{"text":"don't","hint":"no"},{"text":"believe","hint":"creo"},{"text":"it!","hint":""}],"spokenText":"Really? I don't believe it!","ipa":"/ˈrɪli aɪ doʊnt bɪˈliv ɪt/","options":[{"id":"o1","text":"Really","correct":true},{"id":"o2","text":"Very","correct":false},{"id":"o3","text":"Too","correct":false}],"canonicalAnswer":"Really","explanation":"La reacción de sorpresa: «Really? I don't believe it!» (¿de verdad? ¡No lo creo!). «Very» y «too» no preguntan nada."}]}],"story":{"title":"A New Friend in Cancun","lines":[{"speaker":"Narrator","text":"Tom is on vacation in Cancun. He meets Lucia at the beach.","es":"Tom está de vacaciones en Cancún. Conoce a Lucía en la playa."},{"speaker":"Tom","text":"Hi! Where are you from?","es":"¡Hola! ¿De dónde eres?"},{"speaker":"Lucia","text":"I am from Mexico City. And you?","es":"Soy de la Ciudad de México. ¿Y tú?"},{"speaker":"Tom","text":"I am from Chicago. I love the beach here.","es":"Soy de Chicago. Me encanta la playa aquí."},{"speaker":"Lucia","text" function voiceFor(tag, spk){
  if(!_vs.length) _loadVs();
  const pre = (tag || 'en').slice(0, 2).toLowerCase();
  const cand = _vs.filter(v => (v.lang || '').toLowerCase().startsWith(pre));

  const sorted = cand.slice().sort((a, b) => rank(a) - rank(b));

function openSpeechLab(){
 const pool = [];
 allLessons(S.course).forEach(({u,l})=>l.challenges.forEach(ch=>{
  if(ch.spokenText && ch.ipa && ch.type!=='pair_match' && ch.spokenText.length>10){
   pool.push({text:ch.spokenText, ipa:ch.ipa, unit:u.unitNumber, title:l.title, hint:ch.canonicalAnswer||''});
  }
 }));
 const items = shuffle(pool).slice(0, 12);
 let idx = 0, lastSpoken = '';
 openPage('speechLab', `<p class="label">Práctica Oral · ${esc(course().name)}</p><h1 class="display" style="font-size:28px">Laboratorio de Pronunciación y Voz</h1><p class="muted" style="font-size:15px">Escucha el modelo nativo, revisa la transcripción fonética (IPA) y pronuncia en voz alta para comparar palabra por palabra.</p><div id="speechBox"></div>`);
 const draw = () => {
  const it = items[idx];
  const targetWords = it.text.replace(/[—]/g,' ').trim().split(/\s+/);
  const spokenNorm = norm(lastSpoken).split(/\s+/).filter(Boolean);
  const chipsHTML = lastSpoken ? `<div style="margin-top:12px"><p class="label">Comparación palabra por palabra:</p><div>${targetWords.map(w=>{
   const ok = spokenNorm.includes(norm(w));
   return `<span class="word-chip ${ok?'ok':'miss'}">${esc(w)} ${ok?'✓':''}</span>`;
  }).join(' ')}</div><p class="muted" style="font-size:14px;margin-top:6px">Detectado: «${esc(lastSpoken)}»</p></div>` : '';

  $('#speechBox').innerHTML = `<section class="card stack" style="margin-top:12px">
   <div class="row-between"><span class="cefr">Unidad ${it.unit} · ${esc(it.title)}</span><span class="muted num">${idx+1} / ${items.length}</span></div>
   <div style="padding:14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)">
    <p style="font:800 22px/1.35 var(--font-display);margin:0" lang="${esc(course().langTag)}">${esc(it.text)}</p>
    <p class="ipa" style="margin:6px 0 0;font-size:16px">${esc(it.ipa)}</p>
   </div>
   <div class="row wrap">
    <button type="button" class="btn ghost" data-say="${esc(it.text)}">${I.sound} Escuchar normal</button>
    <button type="button" class="btn ghost" data-say-slow="${esc(it.text)}">${I.turtle} Escuchar lento</button>
   </div>
   <div class="row wrap">
    <button type="button" class="mic-btn" id="spMicBtn" style="flex:1">${I.mic} Hablar por micrófono</button>
    <button type="button" class="btn ghost small" id="spSimBtn">Ya lo pronuncié en voz alta (Evaluar)</button>
   </div>
   ${chipsHTML}
   <div class="row" style="margin-top:8px">
    <button type="button" class="btn ghost" id="spPrev">← Anterior</button>
    <button type="button" class="btn" id="spNext" style="flex:1">Siguiente frase →</button>
   </div>
  </section>`;
  bindPage($('#page'));
  $$('[data-say-slow]',$('#speechBox')).forEach(b=>b.onclick=()=>speak(b.dataset.saySlow,true));
  $('#spMicBtn').onclick = () => startInlineMic($('#spMicBtn'), txt => {
   lastSpoken = txt;
   S.speechCount = (S.speechCount||0)+1;
   addXP(5); touchStreak(); checkBadges(); save(); renderTop();
   sfx('ok');
   draw();
  });
  $('#spSimBtn').onclick = () => {
   lastSpoken = it.text;
   S.speechCount = (S.speechCount||0)+1;
   addXP(5); touchStreak(); checkBadges(); save(); renderTop();
   sfx('ok');
   toast('¡Pronunciación registrada! +5 XP');
   draw();
  };
  $('#spPrev').onclick = () => { idx = (idx - 1 + items.length) % items.length; lastSpoken = ''; draw(); };
  $('#spNext').onclick = () => { idx = (idx + 1) % items.length; lastSpoken = ''; draw(); };
 };
 draw();
}
function startInlineMic(btn, onResult){
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
 if(!SR){
  toast('Tu navegador actual no expone SpeechRecognition directo; usa el botón de práctica fonética guiada.');
  return;
 }
 try{
  const rec = new SR();
  rec.lang = course().langTag || 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  btn.classList.add('rec');
  btn.innerHTML = `${I.mic} Escuchando... habla ahora`;
  rec.onresult = e => {
   const t = (e.results&&e.results[0]&&e.results[0][0]) ? e.results[0][0].transcript : '';
   if(t) onResult(t);
  };
  rec.onerror = () => {
   btn.classList.remove('rec');
   btn.innerHTML = `${I.mic} Intentar con micrófono`;
   toast('No se pudo capturar el micrófono en este marco. Puedes usar la evaluación fonética asistida.');
  };
  rec.onend = () => {
   btn.classList.remove('rec');
   btn.innerHTML = `${I.mic} Grabar con micrófono`;
  };
  rec.start();
 }catch(e){
  toast('Micrófono bloqueado por el visor. Usa la simulación fonética guiada abajo.');
 }
}

function dlg(html){ const d=$('#dlg'); d.hidden=false; d.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`; d.onclick=e=>{ if(e.target===d) d.hidden=true; }; return d; }
function copyText(text, el, btn){ const done=ok=>{ if(btn){ const o=btn.innerHTML; btn.classList.add('copied'); btn.innerHTML=ok?`${I.check} Copiada`:`${I.copy} Selecciona y copia`; setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML=o; },2200); } if(ok){ sfx('ok'); live('Copiado al portapapeles.'); } };
 const sel=()=>{ try{ if(el){ if(el.select){ el.focus(); el.select(); el.setSelectionRange(0,text.length); } else { const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } } }catch(e){} };
 sel(); try{ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>done(true),()=>{ let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} sel(); done(ok); }); return; } }catch(e){}
 let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} sel(); done(ok); }

 $('#dNo').onclick=()=>d.hidden=true; $('#cpy').onclick=()=>{ copyText(c,$('#codeTa'),$('#cpy')); S.lastBackup=today(); S.sinceBackup=0; checkBadges(); save(); }; $('#codeTa').onclick=e=>e.target.select(); }
function showImport(){ const d=dlg(`<h2>Recuperar tu avance</h2><p class="muted" style="font-size:15px">Elige el archivo .json que exportaste, o pega tu código corto. Reemplaza el avance de este dispositivo.</p><label class="btn ghost block file-btn">${I.upload} Elegir archivo<input type="file" id="impFile" accept=".json,application/json" hidden></label><textarea class="code-box" id="impTa" rows="3" placeholder="Pega aquí tu código LR1…"></textarea><p id="impMsg" class="warn-line" hidden></p><div class="row"><button class="btn ghost" id="dNo">Cancelar</button><button class="btn" id="impGo">Recuperar</button></div>`);
 const err=m=>{ const e=$('#impMsg'); e.hidden=false; e.innerHTML=I.warn+'<span>'+esc(m)+'</span>'; sfx('bad'); };
 $('#dNo').onclick=()=>d.hidden=true;
 $('#impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const n=fromCode(r.result); d.hidden=true; importState(n,'el archivo'); }catch(x){ err('Ese archivo no parece una copia de '+BRAND.name+'.'); } }; r.readAsText(f); };

const avatar=(p,sz=44)=>{ const [n,skin,hair,st]=p; const hairP={A:'M10 19c0-9 6-13 12-13s12 4 12 13c-2-4-6-6-12-6s-10 2-12 6z',B:'M9 21c0-10 6-15 13-15s13 5 13 15v6c-1-6-3-9-4-10-3 2-14 2-18 0-1 1-3 4-4 10z',C:'M10 18c1-8 6-12 12-12s11 4 12 12c-4-3-8-4-12-4s-8 1-12 4zM30 10c4-2 7 0 7 4-2-1-4-1-6 0z'}[st];

function introLines(l){ const out=[];
 for(const ch of l.challenges){ let en='',es='';
  if(ch.type==='multiple_choice'&&ch.spokenText&&ch.options){ en=ch.spokenText; es=(ch.options.find(o=>o.correct)||{}).text||''; }
  else if(ch.type==='word_bank'&&ch.spokenText&&ch.canonicalAnswer){ en=ch.spokenText; es=ch.canonicalAnswer; }
  else if(ch.type==='word_bank'&&!ch.spokenText&&ch.audioAfterAnswer){ en=ch.audioAfterAnswer; es=''; }
  if(!en||/↔/.test(en)) continue;
  en.split(/\s*—\s*/).filter(Boolean).forEach((t,i,a)=>out.push({en:t.trim(),es:i===a.length-1?es:''}));
  if(out.length>=4) break; }
 return out.slice(0,4); }

 $$('#lBody [data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,false,+(b.dataset.spk||0))); $$('#lBody [data-say-slow]').forEach(b=>b.onclick=()=>speak(b.dataset.saySlow,true,+(b.dataset.spk||0)));
 $('#lFoot').innerHTML=`<button class="btn ghost" id="introAll">${I.sound} Escuchar todo</button><button class="btn" id="introGo">Empezar ejercicios</button>`;
 $('#introAll').onclick=()=>{ let k=0; const go=()=>{ if(k>=lines.length||$('#lesson').hidden||!$('.intro')) return; const li2=k++; const t=lines[li2].en; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang=course().langTag; u.rate=.92; const v=voiceFor(u.lang, li2%2); if(v){ try{ u.voice=v; if(li2%2===1 && voiceFor(u.lang,0)===v) u.pitch=1.18; }catch(e){} } u.onend=()=>setTimeout(go,250); speechSynthesis.speak(u);}catch(e){} }; go(); };

function startLesson(id){ const f=findLesson(id); if(!f) return; if(f.c!==S.course){ S.course=f.c; }

const labItems=()=>Object.values(S.mistakes).filter(m=>m.c===S.course&&(m.n|0)>=3).map(m=>{ for(const x of allLessons(S.course)) for(const ch of x.l.challenges) if(ch.id===m.id) return ch; }).filter(Boolean);
function startLab(){ const items=labItems(); if(!items.length) return; L={ id:null, title:'Laboratorio de errores', unit:null, total:items.length, queue:shuffle(items).map(ch=>({ch,tries:0})), doneN:0, errors:0, inRow:0, xp:0, failed:new Set(), review:true, lab:true }; openLesson(); }
function startReview(){ const items=Object.values(S.mistakes).filter(m=>m.c===S.course&&(!m.due||m.due<=srsTodayStr())).map(m=>{ for(const x of allLessons(S.course)) for(const ch of x.l.challenges) if(ch.id===m.id) return ch; }).filter(Boolean);
 if(!items.length) return; L={ id:null, title:'Repaso de errores', unit:null, total:items.length, queue:shuffle(items).map(ch=>({ch,tries:0})), doneN:0, errors:0, inRow:0, xp:0, failed:new Set(), review:true }; openLesson(); }

function burst(el,n){ if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return; const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; const cols=['#A9DB48','#3FA535','#F98232','#FFD84A','#6BB1CA'];

 for(let i=0;i<36;i++){ const e=document.createElement('i'); e.className=i%2?'leaf':'drop'; e.style.left=Math.random()*100+'%'; e.style.background=cols[i%cols.length]; e.style.animationDelay=(Math.random()*.5)+'s'; e.style.animationDuration=(1.2+Math.random())+'s'; c.appendChild(e); } document.body.appendChild(c); setTimeout(()=>c.remove(),2600); }

<script id="muse-v8-js">
/* LingoREA v8: service worker (instalación completa + abrir sin conexión)
   y aviso amable de respaldo. Ambos con guardas: si algo no aplica, no pasa nada. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
window.addEventListener('load', () => {
  try {
    const raw = localStorage.getItem('lingorea_v5'); if (!raw) return;
    const s = JSON.parse(raw);
    const hasProgress = ((s.xp | 0) > 0) || Object.keys(s.done || {}).length > 0;
    if (!hasProgress || s.lastBackup || localStorage.getItem('lr_nudge_off')) return;
    const d = document.createElement('div');
    d.className = 'lr-nudge';
    d.innerHTML = '<span>Tu avance vive en este navegador. Haz tu respaldo en <b>Perfil → Exportar avance</b> para no perderlo nunca.</span><button type="button">Entendido</button>';
    d.querySelector('button').addEventListener('click', () => { try { localStorage.setItem('lr_nudge_off', '1'); } catch (e) {} d.remove(); });
    document.body.appendChild(d);
  } catch (e) {}
});
</script>
